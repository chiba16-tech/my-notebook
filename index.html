<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#375c50"><meta name="apple-mobile-web-app-capable" content="yes"><title>こもれびノート</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>毎日を、すこし心地よく。</small><h1>こもれびノート <span>✳</span></h1></div><span id="save-status" role="status">端末内に自動保存</span></header>
<nav aria-label="メインメニュー"><button data-view="notes" aria-current="page">✎ ノート</button><button data-view="schedule">▦ スケジュール</button><button data-view="tasks">☑ 仕事・チェック表</button></nav>
<main><section id="notes" class="view"><div class="section-heading"><div><small>YOUR NOTEBOOK</small><h2>思いついたことを、自由に。</h2></div><button id="add-note" class="primary">＋ 新しいノート</button></div><div class="note-layout"><aside><h3>ノート一覧</h3><div id="note-list"></div><p class="hint">ペンで書いて、指でページを移動。<br>内容はこのブラウザに保存されます。</p></aside><article class="paper-card"><div class="note-top"><input id="note-title" aria-label="ノートのタイトル" placeholder="タイトル"><button id="delete-note" class="quiet">削除</button></div><div class="toolbar"><label>用紙 <select id="paper"><option value="grid">方眼</option><option value="ruled">横罫</option><option value="plain">無地</option></select></label><label>色 <input id="ink" type="color" value="#293f39"></label><label>太さ <select id="width"><option value="2">細い</option><option value="4" selected>ふつう</option><option value="8">太い</option></select></label><button id="eraser" aria-pressed="false">消しゴム</button><button id="undo">↶ 戻す</button><label class="touch-option"><input id="finger" type="checkbox">指でも書く</label></div><div class="canvas-scroll"><div id="paper-surface" class="grid"><canvas id="canvas" width="1000" height="1300" aria-label="手書きノート。Apple Pencilまたは指で描画できます"></canvas></div></div><p class="hint paper-footer">Apple Pencilでそのまま書けます。指で書く場合は「指でも書く」をオンにしてください。</p></article></div></section>
<section id="schedule" class="view" hidden><div class="section-heading"><div><small>MAKE ROOM FOR YOUR DAY</small><h2>予定を見渡す</h2></div><div class="segmented"><button id="monthly" aria-pressed="true">月間</button><button id="weekly" aria-pressed="false">週間</button></div></div><div class="card"><div class="calendar-heading"><button id="prev" aria-label="前へ">‹</button><h3 id="period"></h3><button id="next" aria-label="次へ">›</button><button id="today">今日</button></div><div class="calendar-scroll"><div id="calendar"></div></div></div><div class="card"><h3>予定を追加</h3><form id="event-form"><label>日付<input id="event-date" type="date" required></label><label>時間（任意）<input id="event-time" type="time"></label><label class="grow">予定<input id="event-title" maxlength="120" placeholder="例：チームミーティング" required></label><button class="primary">＋ 追加</button></form><h3>予定一覧</h3><div id="event-list"></div></div></section>
<section id="tasks" class="view" hidden><div class="section-heading"><div><small>ONE STEP AT A TIME</small><h2>今日の一歩を、ひとつずつ。</h2></div><span id="task-count" class="badge"></span></div><div class="card"><form id="task-form"><label class="grow">タスク・チェック項目<input id="task-title" placeholder="例：見積書を送る" maxlength="200" required></label><label>期限（任意）<input id="task-date" type="date"></label><button class="primary">＋ 追加</button></form><div id="task-list"></div></div></section>
<footer><span>あなたのペースで、毎日を整える。</span><div><button id="export">バックアップを書き出す</button><label class="file-button">復元する<input id="import" type="file" accept="application/json,.json" hidden></label></div><p>保存先はこの端末のSafariです。大切な内容は定期的にバックアップしてください。</p></footer></main><script type="module" src="app.js"></script></body></html>
